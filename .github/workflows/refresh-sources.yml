name: Refresh public sources
on:
  schedule:
    - cron: '41 0 * * *'
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Source to refresh
        type: choice
        options: [all, notion, news]
        default: all
permissions:
  contents: write
concurrency:
  group: public-source-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Refresh Notion archive
        id: notion
        continue-on-error: true
        if: github.event.schedule == '41 0 * * *' || (github.event_name == 'workflow_dispatch' && inputs.source != 'news')
        env:
          NOTION_REQUEST_INTERVAL_MS: '1800'
        run: npm run data:sync -- --refresh
      - name: Refresh publication headlines
        id: news
        continue-on-error: true
        if: github.event.schedule == '23 */6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.source != 'notion')
        run: npm run news:sync
      - name: Check source invariants and database behavior
        run: npm test
      - name: Verify deployable site
        run: npm run build
      - name: Commit checked snapshots
        # Use the repository owner's existing verified noreply author for the
        # owner's Vercel project. The commit message identifies the automation.
        run: |
          git config user.name 'Anubhab Roy Chowdhury'
          git config user.email '64949713+anubhabrc@users.noreply.github.com'
          git add data/bwm-archive.json data/bwm-import-report.json data/news.json
          if git diff --cached --quiet; then
            echo 'Source snapshots unchanged.'
            exit 0
          fi
          git commit -m 'chore(data): automatically refresh public source snapshots'
          git push origin HEAD:main
      - name: Summarize source freshness
        if: always()
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const archive=JSON.parse(fs.readFileSync('data/bwm-archive.json','utf8'));
          const news=JSON.parse(fs.readFileSync('data/news.json','utf8'));
          console.log(`Notion: ${archive.companies.length} companies, retrieved ${archive.retrieved_at}.`);
          console.log(`RSS: ${news.items.length} retained headlines, snapshot ${news.updated_at}.`);
          for(const feed of news.feeds)console.log(`- ${feed.source_name}: ${feed.status}; checked ${feed.checked_at}; last success ${feed.last_success_at ?? 'never'}`);
          NODE
      - name: Report any failed refresh
        if: steps.notion.outcome == 'failure' || steps.news.outcome == 'failure'
        run: |
          echo 'A source refresh failed. Its previous snapshot was retained; other successful sources were published after validation.'
          exit 1
