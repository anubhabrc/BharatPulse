services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: bharatpulse
      POSTGRES_USER: bharatpulse
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharatpulse -d bharatpulse"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pgdata:
